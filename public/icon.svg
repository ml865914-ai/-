<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)" />

  <!-- Outer Islamic 8-point geometric star subtle border -->
  <g opacity="0.25" stroke="url(#goldGradient)" stroke-width="2" fill="none">
    <rect x="76" y="76" width="360" height="360" rx="30" />
    <rect x="76" y="76" width="360" height="360" rx="30" transform="rotate(45 256 256)" />
  </g>

  <!-- Gold Ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#ringGradient)" stroke-width="4" fill="none" stroke-dasharray="10 5" />
  <circle cx="256" cy="256" r="170" stroke="url(#goldGradient)" stroke-width="2" fill="none" />

  <!-- Crescent and Mosque Minaret / Calligraphic Symbol -->
  <path d="M 230,135 A 110,110 0 1,0 350,290 A 90,90 0 1,1 230,135 Z" fill="url(#goldGradient)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.4))" />

  <!-- Star -->
  <polygon points="340,175 348,198 372,198 353,212 360,235 340,221 320,235 327,212 308,198 332,198" fill="url(#goldGradient)" />

  <!-- Central Calligraphy Text: "محمد ﷺ" -->
  <text x="256" y="380" font-family="'Amiri', 'Cairo', 'Traditional Arabic', serif" font-size="52" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    محمد ﷺ
  </text>
  <text x="256" y="425" font-family="'Cairo', 'Amiri', sans-serif" font-size="24" fill="#a7f3d0" text-anchor="middle">
    صلِّ على الحبيب
  </text>
</svg>